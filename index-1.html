<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071430">
<title>Bunksite × Cave — SRM IST Trichy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --panel:#12161c; --panel2:#171c24; --card:#1b212b; --text:#f4f7fb;
  --muted:#9aa5b5; --line:#28313d; --accent:#8b5cf6; --accent2:#22c55e; --danger:#ef4444;
  --warn:#f59e0b; --blue:#38bdf8; --shadow:0 16px 45px rgba(0,0,0,.22); --radius:18px;
}
[data-theme="light"]{
  --bg:#f5f7fb; --panel:#fff; --panel2:#f8fafc; --card:#fff; --text:#111827;
  --muted:#637083; --line:#e4e8ee; --shadow:0 12px 35px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{color:inherit}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:18px 14px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);display:grid;place-items:center;font-weight:900}
.brand h1{font-size:20px;margin:0}
.brand small{color:var(--muted)}
.profile-mini{display:flex;gap:10px;align-items:center;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:16px}
.avatar{width:38px;height:38px;border-radius:12px;background:#272e39;display:grid;place-items:center;font-weight:800;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.nav{display:grid;gap:6px}
.nav button,.nav a{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:12px;text-decoration:none}
.nav button:hover,.nav button.active,.nav a:hover{background:var(--panel2);color:var(--text)}
.side-footer{margin-top:auto;display:grid;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 14px;border-radius:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.success{background:var(--accent2);border-color:var(--accent2);color:#06210e}
.btn.danger{background:transparent;border-color:#6b2222;color:#ffb4b4}
.btn.small{padding:7px 10px;font-size:13px}
.btn.ghost{background:transparent}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.badge.good{color:#a7f3d0;border-color:#1f7a52;background:rgba(34,197,94,.08)}
.badge.warn{color:#fde68a;border-color:#8a650d;background:rgba(245,158,11,.08)}
.badge.bad{color:#fecaca;border-color:#8b1e1e;background:rgba(239,68,68,.08)}
.main{padding:20px 24px 120px;max-width:1500px;width:100%;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}
.topbar h2{margin:0;font-size:24px}
.topbar .actions{display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.stats{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat{padding:18px}
.stat .label{color:var(--muted);font-size:13px}
.stat .value{font-size:31px;font-weight:850;margin-top:6px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
.grid.main-grid{grid-template-columns:1.45fr 1fr}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.section{padding:18px}
.section h3{margin:0 0 14px;font-size:17px}
.progress{height:12px;background:var(--panel2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress > div{height:100%;border-radius:999px;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e)}
.health{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
.chart{height:230px;display:flex;align-items:end;gap:6px;padding:10px;border-top:1px solid var(--line)}
.bar{flex:1;min-width:4px;border-radius:7px 7px 2px 2px;background:var(--accent);position:relative}
.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);margin-bottom:3px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:650}
.notice{padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);line-height:1.45}
.notice.bad{border-color:#7f1d1d;background:rgba(127,29,29,.14)}
.notice.warn{border-color:#8a650d;background:rgba(120,72,8,.12)}
.notice.good{border-color:#1f7a52;background:rgba(34,197,94,.08)}
.kpi-row{display:flex;flex-wrap:wrap;gap:8px}
.kpi{padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.12)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
.day-classes{display:grid;gap:9px}
.class-row{display:grid;grid-template-columns:1.5fr .8fr .9fr auto;gap:9px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.class-row .subject{font-weight:700}
.class-row .meta{font-size:12px;color:var(--muted)}
.status-buttons{display:flex;gap:6px;flex-wrap:wrap}
.status-buttons button{padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px}
.status-buttons button.selected.present{background:rgba(34,197,94,.14);border-color:#1f7a52;color:#86efac}
.status-buttons button.selected.absent{background:rgba(239,68,68,.12);border-color:#7f1d1d;color:#fecaca}
.status-buttons button.selected.od{background:rgba(56,189,248,.1);border-color:#075985;color:#bae6fd}
.status-buttons button.selected.medical{background:rgba(139,92,246,.12);border-color:#6d28d9;color:#ddd6fe}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calendar .head{font-size:11px;color:var(--muted);text-align:center;padding:8px 2px}
.calendar .cell{min-height:70px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px;display:flex;flex-direction:column;gap:5px}
.calendar .cell.today{outline:2px solid var(--accent)}
.calendar .cell.selected{background:rgba(139,92,246,.12)}
.calendar .date{font-weight:750;font-size:12px}
.dotrow{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:#475569}
.dot.present{background:#22c55e}.dot.absent{background:#ef4444}.dot.od{background:#38bdf8}.dot.medical{background:#8b5cf6}
.chat-fab{position:fixed;right:24px;bottom:24px;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#8b5cf6,#4f46e5);color:#fff;font-size:24px;box-shadow:0 18px 42px rgba(79,70,229,.45);z-index:20}
.chat{position:fixed;right:24px;bottom:92px;width:min(430px,calc(100vw - 28px));height:620px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.32);display:none;flex-direction:column;z-index:19;overflow:hidden}
.chat.open{display:flex}
.chat-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.chat-log{flex:1;overflow:auto;padding:14px;display:grid;align-content:start;gap:10px}
.msg{max-width:86%;padding:10px 12px;border-radius:14px;line-height:1.45;font-size:13px}
.msg.bot{background:var(--panel2);border:1px solid var(--line)}
.msg.user{justify-self:end;background:var(--accent);color:#fff}
.chat-input{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}
.chat-input textarea{flex:1;resize:none;height:48px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at top,#20263a 0,#0b0d10 52%)}
.login-card{width:min(960px,100%);display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.login-left{padding:40px;background:linear-gradient(145deg,#111827,#17152b)}
.login-left h1{font-size:44px;margin:10px 0}
.login-left p{color:#cbd5e1;line-height:1.7}
.login-right{padding:32px}
.mode-tabs{display:flex;gap:6px;margin-bottom:18px}
.mode-tabs button{flex:1}
.mini{font-size:12px;color:var(--muted);line-height:1.5}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50;padding:18px}
.modal-back.open{display:grid}
.modal{width:min(550px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.toast-wrap{position:fixed;top:18px;right:18px;z-index:60;display:grid;gap:8px}
.toast{padding:12px 14px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;box-shadow:var(--shadow);font-size:13px}
@media(max-width:1100px){.shell{grid-template-columns:82px 1fr}.sidebar{padding:14px 10px}.brand .words,.profile-mini .words,.nav button .navtext,.side-footer .words{display:none}.nav button{text-align:center}.grid.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.shell{display:block}.sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:30;border-right:0;border-top:1px solid var(--line);display:flex;flex-direction:row;justify-content:space-around}.brand,.profile-mini,.side-footer{display:none}.nav{display:flex;overflow:auto}.nav button{padding:10px 9px}.main{padding:16px 14px 95px}.grid.main-grid,.grid.two,.form-grid,.login-card{grid-template-columns:1fr}.grid.stats{grid-template-columns:repeat(2,1fr)}.class-row{grid-template-columns:1fr}.chat{right:12px;bottom:82px}.chat-fab{right:12px;bottom:74px}.login-left{padding:26px}.login-left h1{font-size:34px}}
#cave p.s{color:var(--mut);margin:0 0 12px}
#cave button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
#cave button.on{background:var(--ac);color:#fff}
#cave #q{flex:1;min-width:200px}
#cave .fl h3{margin:0 0 8px;font-size:14px;color:var(--mut)}
#cave .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
#cave .t{border-radius:10px;padding:8px;color:#fff;cursor:pointer;min-height:64px;border:2px solid transparent}
#cave .t b{display:block}
#cave .t small{opacity:.95}
#cave .g{background:var(--g)}
#cave .y{background:var(--y);color:#241a00}
#cave .r{background:var(--r)}
#cave .sel{border-color:var(--fg)}
#cave #scene{perspective:1600px;height:860px;overflow:hidden;position:relative;background:linear-gradient(#a9cdee,#e4f0fb 45%,#86b874 45%);border-radius:10px;touch-action:pan-y;cursor:grab}
#cave #cap{position:absolute;left:10px;top:8px;font-size:12px;color:#1f3a5f;z-index:2;background:#fffc;padding:3px 8px;border-radius:6px}
#cave #bld{position:absolute;left:50%;top:92%;width:480px;height:180px;margin-left:-240px;margin-top:-90px;transform-style:preserve-3d;transform:translateY(var(--ty,0px)) scale(calc(var(--s,1)*var(--z,1))) rotateX(var(--rx,62deg)) rotateZ(var(--rz,-25deg))}
#cave #bld div,#cave #bld span{position:absolute}
#cave .gd{left:-170px;top:-130px;width:780px;height:570px;background:#7fb069;transform:translateZ(-6px)}
#cave .ap{left:-24px;top:-20px;width:528px;height:226px;background:#d9cfba;border-radius:6px;transform:translateZ(-5px)}
#cave .rd{left:-170px;top:262px;width:780px;height:72px;background:linear-gradient(90deg,#fff 50%,transparent 50%) 0 34px/40px 4px repeat-x,#4b5058;transform:translateZ(-5px)}
#cave .pa{left:200px;top:196px;width:44px;height:66px;background:#d9cfba;transform:translateZ(-5px)}
#cave .sg{left:10px;top:216px;width:180px;height:26px;transform-origin:bottom;transform:rotateX(-90deg);background:#1d3f8f;color:#fff;font:600 10px/1.1 system-ui;display:flex;align-items:center;justify-content:center;text-align:center;border:3px solid #fff}
#cave .tree{width:0;height:0;transform-style:preserve-3d}
#cave .tp{left:-30px;top:-84px;width:60px;height:84px;transform-origin:bottom;transform:rotateX(-90deg);background:radial-gradient(circle 26px at 50% 30px,#2e8b3d 0 23px,#5bbd68 24px 26px,transparent 27px),linear-gradient(#6b4423,#6b4423) 50% 100%/7px 36px no-repeat}
#cave .tp.b{transform:rotateZ(90deg) rotateX(-90deg)}
#cave .sh{left:-20px;top:-9px;width:40px;height:18px;background:#0003;border-radius:50%;transform:translateZ(-4px)}
#cave .slab.op .fa{border-color:#d84e55;box-shadow:0 0 18px #d84e55;background:rgba(220,228,255,.85)}
#cave .slab{inset:0;transform-style:preserve-3d}
#cave .fa{inset:0;background:rgba(206,211,219,.65);border:2px solid #7d8696;transform:translateZ(0)}
#cave .co{left:0;right:48px;top:74px;height:32px;background:rgba(255,255,255,.5);transform:translateZ(1px)}
#cave .st{right:4px;top:8px;width:40px;height:164px;background:#8f99aa;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:translateZ(1px)}
#cave .bw{left:0;top:-60px;width:480px;height:60px;transform-origin:bottom;transform:rotateX(-90deg);background:repeating-linear-gradient(90deg,transparent 0 76px,#fffb 76px 82px),linear-gradient(#7fb4e6,#2f6aa8);opacity:.6}
#cave .sw{left:0;top:0;width:60px;height:180px;transform-origin:left;transform:rotateY(-90deg);background:repeating-linear-gradient(0deg,transparent 0 76px,#fffb 76px 82px),linear-gradient(90deg,#7fb4e6,#2f6aa8);opacity:.5}
#cave .lb{left:-32px;top:82px;font-size:13px;font-weight:700;color:#fff;background:#3b4252;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;transform:translateZ(1px)}
#cave .rs{left:250px;top:64px;width:150px;height:44px;background:#b3261e;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;transform:translateZ(3px);border:3px solid #fff}
#cave .tk{width:46px;height:46px;border-radius:50%;background:radial-gradient(#f1f4f8 34%,#8fa0b5 36%);transform:translateZ(2px)}
#cave .rm{width:120px;height:66px;transform-style:preserve-3d;cursor:pointer}
#cave .rm div,#cave .rm i,#cave .rm u{position:absolute}
#cave .fo{inset:0;background:repeating-linear-gradient(0deg,#0000 0 11px,#0002 11px 12px),repeating-linear-gradient(90deg,#0000 0 11px,#0002 11px 12px),var(--c);transform:translateZ(1px);border:1px solid #0006}
#cave .lbl{left:6px;top:5px;width:108px;transform:translateZ(13px);background:#0f172ad0;border:2px solid var(--c);color:#fff;padding:2px 3px;border-radius:8px;text-align:center;font-size:10px;line-height:1.15}
#cave .lbl b{display:block;font-size:22px;font-weight:800;letter-spacing:.5px}
#cave .lbl em{display:block;font-style:normal;font-size:8px;opacity:.85}
#cave .cl{width:56px;height:22px;background:#fff;color:#111;font:800 11px/18px system-ui;text-align:center;border-radius:4px;border:2px solid var(--c);transform:translateZ(2px);overflow:hidden}
#cave .rm i{width:46px;height:9px;transform-style:preserve-3d}
#cave .rm i::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 18%,#fffb 18% 26%,transparent 26% 58%,#fffb 58% 66%,transparent 66%),#b98246;border:1px solid #6b4423;transform:translateZ(9px)}
#cave .occ i::before{background:radial-gradient(circle,#173a6b 0 2.6px,transparent 3.2px) 0 0/15.3px 9px,#b98246}
#cave .rm i::after{content:"";position:absolute;left:0;top:0;width:100%;height:9px;background:#7a4f24;transform-origin:bottom;transform:rotateX(-90deg)}
#cave .rm i b{position:absolute;left:0;top:-9px;width:100%;height:9px;background:#6a4320;transform-origin:bottom;transform:rotateX(-90deg)}
#cave .wb,#cave .wf{left:0;width:120px;height:52px;transform-origin:bottom;transform:rotateX(-90deg);background:color-mix(in srgb,var(--c) 38%,transparent);border:1px solid var(--c)}
#cave .wb{top:-52px}
#cave .wf{top:14px}
#cave .wd::after{content:"";position:absolute;left:50px;bottom:0;width:20px;height:38px;background:#6b4423;border:1px solid #3d2410}
#cave .wk::after{content:"";position:absolute;left:8px;top:14px;width:50px;height:22px;background:#1f4d3a;border:2px solid #ddd;box-shadow:0 3px 0 #b9a27c}
#cave .ac .wk::before{content:"";position:absolute;left:92px;top:2px;width:24px;height:6px;background:#fff;border-radius:2px}
#cave .nac .wk::before{content:"";position:absolute;left:100px;top:2px;width:12px;height:12px;border-radius:50%;background:radial-gradient(#444 30%,#ddd 32%)}
#cave .wl,#cave .wr{top:0;width:52px;height:66px;transform-origin:left;transform:rotateY(-90deg);background:color-mix(in srgb,var(--c) 34%,transparent);border:1px solid var(--c)}
#cave .wl{left:0}
#cave .wr{left:120px}
#cave .wi{background:linear-gradient(135deg,#eaf6ff,#8fc3ee 60%,#cfe8ff);border:2px solid #fff;box-shadow:0 3px 0 #cfd6de,inset 0 0 0 1px #5a7ea3}
#cave .wi::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff}
#cave .wi::after{content:"";position:absolute;top:50%;left:0;right:0;height:2px;margin-top:-1px;background:#fff}
#cave .sd{left:10px;top:12px;width:34px;height:42px}
#cave .rm.sel .fo{outline:3px solid #fff;box-shadow:0 0 16px #fff}
#cave #det{position:sticky;bottom:8px;border-color:var(--ac)}
#cave #cd{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
#cave .res{padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
#cave .leg span{margin-right:12px}
#cave .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#cave a.wa{display:inline-block;background:#25d366;color:#04310f;font-weight:600;text-decoration:none;padding:9px 14px;border-radius:8px}
#cave .sc{box-shadow:0 6px 18px #0002}
#cave .ttl{font-weight:700;font-size:16px;margin-bottom:8px}
#cave .sc #q{width:100%;padding:12px;font-size:15px}
#cave .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
#cave .chip,#cave #fb button{border-radius:20px;padding:5px 12px;font-size:13px}
#cave #fb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#cave button.big{width:100%;padding:13px;font-weight:700;letter-spacing:.5px;font-size:15px;border-radius:10px}
#cave .tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:4px}
#cave .tabs button{flex:1;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;font-weight:600;color:var(--mut)}
#cave .tabs button.on{color:var(--ac);border-bottom-color:var(--ac);background:none}
#cave .tiles{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))!important}
#cave .bc{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--g);border-radius:10px;padding:10px 12px;cursor:pointer;margin-top:6px}
#cave .s-y{border-left-color:var(--y)}
#cave .s-r{border-left-color:var(--r)}
#cave .bc .l{flex:1}
#cave .bc .l b{display:block;font-size:17px}
#cave .bc .l small{display:block;color:var(--mut);font-size:12px}

/* ===== Merged theme: SRM IST Trichy ===== */
:root{--bg:#071430;--panel:#0c1d42;--panel2:#12295a;--card:#0f2350;--line:#23407c;--text:#eef2fb;--muted:#9fb1d8;--accent:#2f6bff;--gold:#f4b41a;--onaccent:#fff;--overlay:.8;--shadow:0 16px 45px rgba(2,8,24,.4)}
[data-theme="light"]{--bg:#eef2f9;--panel:#fff;--panel2:#f3f6fc;--card:#fff;--line:#d6dfef;--text:#0a1b3f;--muted:#5b6b8c;--shadow:0 12px 35px rgba(10,27,63,.10)}
html{background:var(--bg)}body{background:transparent;font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;letter-spacing:-.01em}
#scenery{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
#scenery i{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 2.4s ease}
#scenery i.on{opacity:1;animation:kb 26s ease-in-out infinite alternate}
#scenery b{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) calc(var(--overlay)*100%),transparent)}
@keyframes kb{to{transform:scale(1.08) translate(-1.5%,-1%)}}
.sidebar{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(16px)}
.btn{transition:transform .15s,filter .15s}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}.btn.primary:hover{filter:brightness(1.12)}
.nav button.active{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--text);box-shadow:inset 3px 0 0 var(--gold)}
.logo,.chat-fab{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));color:var(--onaccent)}
.msg.user{background:var(--accent);color:var(--onaccent)}
.calendar .cell.today{outline-color:var(--accent)}.calendar .cell.selected{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}
.bar{background:linear-gradient(var(--gold),var(--accent))}.progress>div{transition:width .8s cubic-bezier(.2,.7,.2,1)}
.login-shell{background:transparent}
.login-card{backdrop-filter:blur(18px);background:color-mix(in srgb,var(--panel) 84%,transparent)}
.login-left{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 38%,#050d22),#050d22 78%);color:#fff}.login-left h1{font-size:48px}
[data-theme="light"] .badge.good{color:#0f7a4d}[data-theme="light"] .badge.warn{color:#9a6a00}[data-theme="light"] .badge.bad{color:#b42318}
[data-theme="light"] .btn.danger{color:#b42318;border-color:#e6a4a0}
.modal{animation:pop .22s ease}.toast{animation:tin .25s ease}.pgin{animation:pgin .35s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{transform:scale(.96);opacity:0}}@keyframes tin{from{transform:translateX(24px);opacity:0}}@keyframes pgin{from{opacity:0;transform:translateY(8px)}}
html[data-anim="off"] *,html[data-anim="off"] *::before,html[data-anim="off"] *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:calc(var(--radius) + 6px);min-height:230px;margin-bottom:14px;color:#fff;box-shadow:var(--shadow);isolation:isolate;display:flex;align-items:flex-end}
.hero .ph{position:absolute;inset:0;z-index:-2;background:var(--hbg) center/cover;animation:kb 30s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(5,13,34,.94) 8%,rgba(5,13,34,.55) 55%,rgba(5,13,34,.12))}
.hero-in{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end;padding:30px;width:100%}
.hero h2{font-size:clamp(26px,4vw,40px);margin:4px 0 8px;line-height:1.05}.hero small{color:var(--gold);font-weight:600}.hero p{margin:0;color:#dbe4f7;max-width:46ch;line-height:1.5}

.rchip{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:6px 11px;font-size:12px;transition:transform .15s,background .15s}.rchip:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}

.sw i{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--a) 0 50%,var(--g) 0)}.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}.sw:hover{transform:translateY(-2px)}

/* cave inside the shell */
#cave{--fg:var(--text);--mut:var(--muted);--bd:var(--line);--ac:var(--accent);--g:#22a559;--y:#e9a91b;--r:#d9433b}

#cave .slab{transition:transform .7s cubic-bezier(.3,.7,.2,1)}#cave .bc{transition:transform .15s}#cave .bc:hover{transform:translateX(3px)}

function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }
function toast(msg){ const w=document.getElementById("toastWrap"); const el=document.createElement("div"); el.className="toast"; el.textContent=msg; w.appendChild(el); setTimeout(()=>el.remove(),3200); }
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ return parseDate(s).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
function dayNum(s){ return parseDate(s).getDay(); } // 0 Sun
function getTemplate(){ return templates.find(t=>t.id===state.semester.templateId) || templates[0]; }
function statusLabel(st){ return st==="present"?"Present":st==="absent"?"Absent":st==="od"?"OD":st==="medical"?"Medical":"Unmarked"; }
function attendanceMap(){ const m=new Map(); state.attendance.filter(mine).forEach(r=>m.set(`${r.date}|${r.subjectId}|${r.period}`,r.status)); return m; }
function getStatus(date,subjectId,period){ return attendanceMap().get(`${date}|${subjectId}|${period}`)||null; }
function setStatus(date,subjectId,period,status){
  const key=`${date}|${subjectId}|${period}`;
  state.attendance=state.attendance.filter(r=>`${r.date}|${r.subjectId}|${r.period}`!==key);
  if(status) state.attendance.push({date,subjectId,period,status,tpl:state.semester.templateId});
  saveState(); render();
}
function inSemester(s){ return s>=state.semester.start && s<=state.semester.end; }
function isHoliday(s){ return state.holidays.includes(s); }
function scheduledOn(date){
  if(!inSemester(date) || isHoliday(date)) return [];
  const t=getTemplate(), weekday=dayNum(date);
  const entries=t.schedule[weekday]||[];
  return entries.map(([slot,period])=>({slot,period,subjectId:slot,subjectName:t.subjects[slot]||slot,code:t.codes[slot]||"",time:timeSets[t.years][period-1]}));
}
function dateRange(a,b){
  const out=[]; let d=parseDate(a); const end=parseDate(b);
  while(d<=end){ out.push(isoDate(d)); d.setDate(d.getDate()+1); }
  return out;
}
function allScheduled(){
  const out=[]; for(const d of dateRange(state.semester.start,state.semester.end)){ for(const c of scheduledOn(d)) out.push({...c,date:d}); }
  return out;
}
function recordsForSubject(subjectId){
  return state.attendance.filter(r=>r.subjectId===subjectId&&mine(r));
}
function eligibleStats(subjectId, upToDate=null){
  const rec=recordsForSubject(subjectId).filter(r=>!upToDate || r.date<=upToDate);
  let attended=0, held=0, od=0, medical=0, absent=0, unmarkedPast=0;
  rec.forEach(r=>{
    if(r.status==="present"){attended++;held++}
    else if(r.status==="absent"){held++;absent++}
    else if(r.status==="od"){od++}
    else if(r.status==="medical"){medical++}
  });
  // Count only classes that were actually marked. Unmarked past classes are reported separately.
  return {attended,held,od,medical,absent,unmarkedPast};
}
function targetRequired(attended,eligibleTotal,target){
  return Math.max(0,Math.ceil(target*eligibleTotal-attended-1e-9));
}
function subjectProjection(subjectId){
  const t=getTemplate();
  const rec=eligibleStats(subjectId,TODAY_ISO);
  const future=allScheduled().filter(x=>x.date>TODAY_ISO && x.subjectId===subjectId).length;
  const maxPct=(rec.held+future)>0 ? ((rec.attended+future)/(rec.held+future))*100 : 100;
  const currentPct=rec.held>0 ? rec.attended/rec.held*100 : 0;
  return {rec,future,maxPct,currentPct,name:t.subjects[subjectId],code:t.codes[subjectId]||""};
}
function overallStats(){
  const all=allScheduled();
  const map=attendanceMap();
  let planned=all.length, attended=0, currentHeld=0, currentAttended=0, currentEligible=0, future=0, od=0, medical=0, absent=0, unmarkedPast=0;
  all.forEach(x=>{
    const st=map.get(`${x.date}|${x.subjectId}|${x.period}`);
    if(x.date>TODAY_ISO) future++;
    if(st==="present"){ attended++; if(x.date<=TODAY_ISO){currentHeld++;currentAttended++;} }
    else if(st==="absent"){ if(x.date<=TODAY_ISO){currentHeld++;} absent++; }
    else if(st==="od"){ od++; }
    else if(st==="medical"){ medical++; }
    else if(x.date<=TODAY_ISO){unmarkedPast++; }
    if(st==="present"||st==="absent"){ if(x.date<=TODAY_ISO) currentEligible++; }
  });
  const eligiblePlanned=planned-od-medical;
  const plannedPct=eligiblePlanned>0 ? attended/eligiblePlanned*100 : 0;
  const currentPct=currentEligible>0 ? currentAttended/currentEligible*100 : 0;
  const req90=targetRequired(attended,eligiblePlanned,0.90);
  const req75=targetRequired(attended,eligiblePlanned,0.75);
  const maxFinal=(currentEligible+future)>0 ? (currentAttended+future)/(currentEligible+future)*100 : 100;
  const plannedLeft=Math.max(0, future);
  return {planned,eligiblePlanned,attended,currentHeld,currentAttended,currentEligible,currentPct,plannedPct,future,plannedLeft,od,medical,absent,unmarkedPast,req90,req75,maxFinal};
}
function holidayStats(){
  const hs=state.holidays.filter(inSemester).sort();
  return {total:hs.length,left:hs.filter(x=>x>TODAY_ISO).length};
}
function statusForPct(pct,maxPct=100){
  if(maxPct<75) return ["bad","Irreversible Detention"];
  if(pct<75) return ["bad","Below 75%"];
  if(pct<80) return ["warn","Approaching warning"];
  return ["good","Healthy"];
}
function initials(name){ return (name||"BS").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"BS"; }

async function hashPassword(password,salt){
  const data=new TextEncoder().encode(password+":"+salt);
  const buf=await crypto.subtle.digest("SHA-256",data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function randomSalt(){ return crypto.getRandomValues(new Uint32Array(4)).join("-"); }
async function checkPassword(pw){
  if(!state.account) return false;
  return (await hashPassword(pw,state.account.salt))===state.account.hash;
}

function themeApply(){
  const pref=state.theme;
  const actual=pref==="system" ? (matchMedia("(prefers-color-scheme: light)").matches?"light":"dark") : pref;

}

    document.getElementById("otpStep").innerHTML=`

      <div class="field" style="margin-top:12px"><label>OTP</label><input id="otpInput"></div>

function nextNDates(start,n){
  const out=[]; let d=parseDate(start); for(let i=0;i<n;i++){out.push(isoDate(d));d.setDate(d.getDate()+1)} return out;
}

function campusArt(){
  const w=[...Array(9)].map((_,i)=>[250,315,380].map(y=>`<rect x="${470+i*72}" y="${y}" width="44" height="30" rx="3"/>`).join("")).join("");
  const t=[80,240,1290,1450,1560].map((x,i)=>`<rect x="${x-6}" y="430" width="12" height="70" fill="#5a3a1e"/><circle cx="${x}" cy="${410-i%2*20}" r="${52+i%3*8}" fill="#2f8f46"/>`).join("");
  const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173a7a"/><stop offset=".55" stop-color="#f2b46a"/><stop offset="1" stop-color="#f7d9a0"/></linearGradient></defs><rect width="1600" height="600" fill="url(#a)"/><circle cx="1240" cy="200" r="70" fill="#ffe7a8" opacity=".9"/><path d="M0 430Q300 360 620 420T1600 400V600H0Z" fill="#3c7a4a"/><rect x="430" y="210" width="740" height="250" fill="#e8dcc4"/><rect x="430" y="196" width="740" height="18" fill="#1d3f8f"/><g fill="#7fb4e6">${w}</g><rect x="640" y="150" width="320" height="46" rx="4" fill="#1d3f8f" stroke="#fff" stroke-width="4"/><text x="800" y="182" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">SRM IST · TIRUCHIRAPPALLI</text><rect y="500" width="1600" height="100" fill="#3d434c"/><path d="M0 550H1600" stroke="#fff" stroke-width="4" stroke-dasharray="40 30"/>${t}</svg>`;
  return "url('data:image/svg+xml,"+encodeURIComponent(s)+"')";
}
const photoCss=u=>"url('"+u.replace(/'/g,"%27")+"')";
function heroBg(){const c=state.custom;return (c.useArt||!c.photos.length)?campusArt():photoCss(c.photos[0])}
function updateScenery(){
  let el=document.getElementById("scenery");
  if(!el){el=document.createElement("div");el.id="scenery";el.innerHTML="<i></i><i></i><b></b>";document.body.prepend(el)}
  const c=state.custom,urls=(c.useArt||!c.photos.length)?[null]:c.photos,key=JSON.stringify(urls.map(u=>u&&u.length));
  if(el.dataset.k===key)return;
  el.dataset.k=key;clearInterval(scT);
  const [a,b]=el.querySelectorAll("i"),ok=[];let pend=urls.length,idx=0;
  const set=(n,u)=>{n.style.backgroundImage=u?photoCss(u):campusArt()};
  const go=()=>{const L=ok.length?ok:[null];set(a,L[0]);a.classList.add("on");b.classList.remove("on");
    if(L.length>1){let cur=a,nx=b;scT=setInterval(()=>{idx=(idx+1)%L.length;set(nx,L[idx]);nx.classList.add("on");cur.classList.remove("on");[cur,nx]=[nx,cur]},9000)}};
  urls.forEach(u=>{if(!u){ok.push(u);if(!--pend)go();return}
    const im=new Image();im.onload=()=>{ok.push(u);if(!--pend)go()};im.onerror=()=>{if(!--pend)go()};im.src=u});
}
function applyCustom(){
  const c=state.custom,r=document.documentElement.style;
  r.setProperty("--accent",c.accent);r.setProperty("--gold",c.gold);r.setProperty("--radius",c.radius+"px");r.setProperty("--overlay",c.overlay);
  r.setProperty("--onaccent",lum(c.accent)>.42?"#111":"#fff");r.setProperty("--sky1",c.sky);r.setProperty("--grass",c.grass);
  document.documentElement.dataset.anim=c.anim?"on":"off";updateScenery();
}
function nextClass(){
  const n=new Date(),m=n.getHours()*60+n.getMinutes(),f=x=>{const[h,i]=x.split(":");return h*60+ +i};
  return scheduledOn(TODAY_ISO).filter(c=>c.time).find(c=>f(c.time[1])>m)||null;
}
function heroHtml(o){
  const c=state.custom;if(!c.showHero)return"";
  const p=state.profile,h=new Date().getHours(),g=h<12?"Good morning":h<17?"Good afternoon":"Good evening",nc=nextClass(),fr=Cave.free(4);
  return `<section class="hero" style="--hbg:${heroBg()}"><div class="ph"></div><div class="hero-in"><div><small>${escapeHtml(p.college||"SRM IST Tiruchirappalli")}</small><h2>${g}, ${escapeHtml(p.displayName||"there")}</h2><p>${nc?`Next class: <b>${escapeHtml(nc.subjectName)}</b> · P${nc.period} · ${nc.time[0]}.`:"No more classes on your timetable today."} Attendance so far: <b>${o.currentPct.toFixed(1)}%</b>.</p></div>
  ${c.showRooms?`<div class="hero-rooms"><span>Free rooms right now</span><div>${fr.map(x=>`<button class="rchip" data-room="${escapeHtml(x.id)}"><b>${escapeHtml(x.id)}</b> ${x.ac?"AC":"Non-AC"} · ${x.txt}</button>`).join("")||"<em>No free room found</em>"}</div><button class="btn primary small" data-tab="rooms">Open cave map</button></div>`:""}</div></section>`;
}
function customiseHtml(){
  const c=state.custom;
  return `<div class="grid two">
<section class="card section"><h3>Look and feel</h3><div class="swatches">${Object.entries(PRESETS).map(([n,p])=>`<button class="sw${c.accent===p.accent?" on":""}" data-preset="${n}" style="--a:${p.accent};--g:${p.gold}"><i></i><span>${n}</span></button>`).join("")}</div>
<div class="form-grid" style="margin-top:14px">
<div class="field"><label>Accent colour</label><input type="color" id="cuAccent" value="${c.accent}"></div>
<div class="field"><label>Highlight colour</label><input type="color" id="cuGold" value="${c.gold}"></div>
<div class="field"><label>Theme</label><select id="cuTheme">${["system","light","dark"].map(x=>`<option ${state.theme===x?"selected":""}>${x}</option>`).join("")}</select></div>
<div class="field"><label>App name</label><input id="cuBrand" value="${escapeHtml(c.brand)}" maxlength="18"></div>
<div class="field"><label>Corner roundness (${c.radius}px)</label><input type="range" id="cuRadius" min="6" max="30" value="${c.radius}"></div>
<div class="field"><label>Photo dimming (${Math.round(c.overlay*100)}%)</label><input type="range" id="cuOverlay" min="40" max="95" value="${Math.round(c.overlay*100)}"></div></div>
<div class="row" style="margin-top:14px"><label class="tog"><input type="checkbox" id="cuAnim" ${c.anim?"checked":""}> Animations</label><label class="tog"><input type="checkbox" id="cuHero" ${c.showHero?"checked":""}> Dashboard banner</label><label class="tog"><input type="checkbox" id="cuRooms" ${c.showRooms?"checked":""}> Free rooms on banner</label></div></section>
<section class="card section"><h3>Campus photos</h3><div class="mini">Photos rotate as the background and on the dashboard banner. With none added, the built-in SRM Trichy illustration is used.</div>
<div class="thumbs">${c.photos.map((u,i)=>`<div class="th" style="background-image:${photoCss(u)}"><button data-rmphoto="${i}" title="Remove">×</button></div>`).join("")||'<div class="mini">No photos added yet.</div>'}</div>
<div class="row" style="margin-top:12px"><input id="cuUrl" placeholder="Paste an image address (https://…)" style="flex:1;min-width:180px"><button class="btn primary" id="cuAddUrl">Add photo</button></div>
<div class="row" style="margin-top:10px"><label class="btn" for="cuFile">Upload photos</label><input id="cuFile" type="file" accept="image/*" multiple hidden><button class="btn" id="cuSearch">Find SRM Trichy photos online</button><label class="tog"><input type="checkbox" id="cuArt" ${c.useArt?"checked":""}> Use illustration instead</label></div></section></div>
<section class="card section" style="margin-top:14px"><h3>3D cave map colours</h3><div class="form-grid"><div class="field"><label>Sky</label><input type="color" id="cuSky" value="${c.sky}"></div><div class="field"><label>Lawn</label><input type="color" id="cuGrass" value="${c.grass}"></div></div><div class="row" style="margin-top:14px"><button class="btn danger" id="cuReset">Reset customisation</button></div></section>`;
}
function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",.78))};im.src=r.result};r.readAsDataURL(f)})}
function wireExtras(){document.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>{Cave.select(b.dataset.room);state.tab="rooms";saveState();render()})}
function wireCustomise(){
  const $$=id=>document.getElementById(id);if(!$$("cuAccent"))return;const c=state.custom;
  const live=(id,key,fn=v=>v)=>{$$(id).oninput=e=>{c[key]=fn(e.target.value);applyCustom()};$$(id).onchange=()=>{saveState();render()}};
  live("cuAccent","accent");live("cuGold","gold");live("cuSky","sky");live("cuGrass","grass");live("cuRadius","radius",Number);live("cuOverlay","overlay",v=>v/100);
  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{Object.assign(c,PRESETS[b.dataset.preset]);saveState();render()});
  $$("cuTheme").onchange=e=>{state.theme=e.target.value;saveState();render()};
  $$("cuBrand").onchange=e=>{c.brand=e.target.value.trim()||"bunksite";saveState();render()};
  [["cuAnim","anim"],["cuHero","showHero"],["cuRooms","showRooms"],["cuArt","useArt"]].forEach(([id,k])=>$$(id).onchange=e=>{c[k]=e.target.checked;saveState();render()});
  $$("cuAddUrl").onclick=()=>{const u=$$("cuUrl").value.trim();if(!/^https?:\/\//i.test(u))return toast("Paste a full image address starting with https://");c.photos.push(u);c.useArt=false;saveState();render();toast("Photo added.")};
  $$("cuFile").onchange=async e=>{for(const f of e.target.files)c.photos.push(await shrink(f));c.useArt=false;saveState();render()};
  $$("cuSearch").onclick=()=>window.open("https://www.google.com/search?tbm=isch&q="+encodeURIComponent("SRM IST Tiruchirappalli campus"),"_blank");
  document.querySelectorAll("[data-rmphoto]").forEach(b=>b.onclick=()=>{c.photos.splice(+b.dataset.rmphoto,1);saveState();render()});
  $$("cuReset").onclick=()=>{state.custom=clone(CUSTOM_DEFAULTS);saveState();render()};
}

render();
</script>
</body>
</html>
